name: Build Orbit Browser iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'app/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
permissions:
  contents: write
jobs:
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate app icon
        run: |
          npm install --no-save --package-lock=false sharp
          node -e "require('sharp')('assets/orbit-icon.svg').resize(1024,1024).png().toFile('assets/orbit-icon.png').then(()=>console.log('Generated Orbit icon'))"
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Resolve workspace and application scheme
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || { echo "No top-level CocoaPods workspace found."; exit 1; }

          # Do not select the first listed scheme: Xcode commonly lists pod schemes
          # (for example EXConstants) before the actual app scheme.
          xcodebuild -list -workspace "$WORKSPACE" > /tmp/orbit-xcode-workspace-list.txt 2>&1
          cat /tmp/orbit-xcode-workspace-list.txt
          SCHEMES="$(awk '/Schemes:/{found=1;next} found && NF {gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print}' /tmp/orbit-xcode-workspace-list.txt)"
          EXPECTED_SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          SCHEME="$(printf '%s\n' "$SCHEMES" | grep -Fx "$EXPECTED_SCHEME" || true)"

          if [ -z "$SCHEME" ]; then
            echo "Required app scheme '$EXPECTED_SCHEME' was not found. Refusing to build a pod/library scheme."
            echo "Available schemes:"
            printf '%s\n' "$SCHEMES"
            exit 1
          fi

          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using workspace: $WORKSPACE"
          echo "Using application scheme: $SCHEME"
      - name: Resolve native package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace "$IOS_WORKSPACE" -scheme "$IOS_SCHEME"
      - name: Build iOS Simulator app
        run: xcodebuild -workspace "$IOS_WORKSPACE" -scheme "$IOS_SCHEME" -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO
      - name: Verify simulator app bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS_DIR="ios/build/Build/Products"
          APP_PATH="$(find "$PRODUCTS_DIR" -type d -name '*.app' -path '*iphonesimulator*' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No simulator .app found under $PRODUCTS_DIR; listing build products:"
            find ios/build -type d -name '*.app' -print || true
            exit 1
          fi
          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST" || { echo "Missing Info.plist: $PLIST"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST"
      - name: Package simulator app
        run: |
          mkdir -p builds/ios
          APP_PATH="$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" builds/ios/Orbit-Browser-iOS-Simulator.zip
          unzip -t builds/ios/Orbit-Browser-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-iOS-Simulator
          path: builds/ios/Orbit-Browser-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish simulator build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-ios-simulator-latest
          name: Orbit Browser iOS Simulator (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: builds/ios/Orbit-Browser-iOS-Simulator.zip
