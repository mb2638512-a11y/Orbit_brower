name: Build Orbit Browser macOS
on:
  workflow_dispatch:
  push:
    branches: [build/macos]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-macos.yml'
      - 'app/**'
      - 'package.json'
      - 'app.json'
permissions:
  contents: write
jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Expo app dependencies
        run: npm install --legacy-peer-deps
      - name: Export web app
        run: npx expo export --platform web
      - name: Prepare desktop package
        run: mkdir -p desktop/renderer && cp -r dist/* desktop/renderer/ && npm --prefix desktop install --include=dev
      - name: Verify Electron installation
        run: npm --prefix desktop exec -- electron --version
      - name: Build macOS DMG
        run: npm --prefix desktop exec -- electron-builder --mac dmg --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-macOS-${{ matrix.arch }}
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "orbit-browser-macos-${{ matrix.arch }}-latest"
          name: "Orbit Browser macOS ${{ matrix.arch }} (latest)"
          prerelease: true
          make_latest: false
          overwrite_files: true
      - name: Delete stale assets from this macOS architecture release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: orbit-browser-macos-${{ matrix.arch }}-latest
        with:
          script: |
            const fs = require('fs');
            const keep = fs.readdirSync('desktop/dist').filter(name => name.toLowerCase().endsWith('.dmg'));
            if (keep.length === 0) throw new Error('No new macOS DMG found; refusing to delete old release assets.');
            const release = await github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag: process.env.RELEASE_TAG});
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner: context.repo.owner, repo: context.repo.repo, release_id: release.data.id, per_page: 100});
            for (const asset of assets) {
              if (!keep.includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id});
                core.info('Deleted stale macOS asset: ' + asset.name);
              }
            }
          files: desktop/dist/*.dmg
