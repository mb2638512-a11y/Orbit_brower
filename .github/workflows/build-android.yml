name: Build Orbit Browser Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, platform-builds]
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Copy APK into build folder
        run: mkdir -p builds/android && cp android/app/build/outputs/apk/debug/app-debug.apk builds/android/Orbit-Browser-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Android-APK
          path: builds/android/Orbit-Browser-debug.apk
          if-no-files-found: error
          retention-days: 14
