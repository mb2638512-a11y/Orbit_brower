name: Build Orbit Browser Android APK
on:
  workflow_dispatch:
  push:
    branches: [platform-builds]
    paths:
      - 'app/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Copy APK into build folder
        run: mkdir -p builds/android && cp android/app/build/outputs/apk/debug/app-debug.apk builds/android/Orbit-Browser-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Android-debug-APK
          path: builds/android/Orbit-Browser-Android-debug.apk
          if-no-files-found: error
          retention-days: 365
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-android-latest
          name: Orbit Browser Android (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: builds/android/Orbit-Browser-Android-debug.apk
