name: Build Orbit Browser Android APK
on:
  workflow_dispatch:
  push:
    branches: [build/android]
    paths:
      - 'app/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Verify Android NDK installation
        run: test -d "$ANDROID_HOME/ndk/27.1.12297006"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone APK with bundled JavaScript
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify APK contains packaged JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
      - name: Copy standalone APK into build folder
        run: mkdir -p builds/android && cp android/app/build/outputs/apk/release/app-release.apk builds/android/Orbit-Browser-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Android-Standalone-APK
          path: builds/android/Orbit-Browser-Android.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-android-latest
          name: Orbit Browser Android (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: builds/android/Orbit-Browser-Android.apk
      - name: Delete stale assets from the Android latest release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: orbit-browser-android-latest
          KEEP_ASSET: Orbit-Browser-Android.apk
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag: process.env.RELEASE_TAG});
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner: context.repo.owner, repo: context.repo.repo, release_id: release.data.id, per_page: 100});
            for (const asset of assets) {
              if (asset.name !== process.env.KEEP_ASSET) {
                await github.rest.repos.deleteReleaseAsset({owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id});
                core.info('Deleted stale Android asset: ' + asset.name);
              }
            }
