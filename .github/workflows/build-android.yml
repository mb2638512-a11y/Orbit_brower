name: Build Orbit Browser Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'package.json', 'package-lock.json', 'app.json', '.github/workflows/build-android.yml']
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate premium Orbit app icon
        run: |
          npm install --no-save --package-lock=false sharp
          node -e "require('sharp')('assets/orbit-icon.svg').resize(1024,1024).png().toFile('assets/orbit-icon.png').then(()=>console.log('Generated Orbit icon'))"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone APK with bundled JavaScript
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify APK contains packaged JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
      - name: Copy standalone APK into build folder
        run: mkdir -p builds/android && cp android/app/build/outputs/apk/release/app-release.apk builds/android/Orbit-Browser-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Android-Standalone-APK
          path: builds/android/Orbit-Browser-Android.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-android-latest
          name: Orbit Browser Android (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: builds/android/Orbit-Browser-Android.apk
