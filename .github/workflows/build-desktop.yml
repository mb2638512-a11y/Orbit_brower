name: Build Orbit Browser Linux
on:
  workflow_dispatch:
  push:
    branches: [build/linux]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
      - 'app/**'
      - 'package.json'
      - 'app.json'
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Expo app dependencies
        run: npm install --legacy-peer-deps
      - name: Export web app
        run: npx expo export --platform web
      - name: Prepare desktop package
        run: mkdir -p desktop/renderer && cp -r dist/* desktop/renderer/ && npm --prefix desktop install --include=dev
      - name: Verify Electron installation
        working-directory: desktop
        run: npx electron --version
        env:
          ELECTRON_DISABLE_SANDBOX: 1
      - name: Build Linux AppImage
        working-directory: desktop
        run: npx electron-builder --linux AppImage --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Linux-${{ matrix.arch }}-AppImage
          path: desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-linux-${{ matrix.arch }}-latest
          name: Orbit Browser Linux ${{ matrix.arch }} (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            desktop/dist/*.AppImage
            screenshots/linux-${{ matrix.arch }}-dashboard.svg
      - name: Delete stale assets from this Linux architecture release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: orbit-browser-linux-${{ matrix.arch }}-latest
        with:
          script: |
            const fs = require('fs');
            const keep = fs.readdirSync('desktop/dist').filter(name => name.toLowerCase().endsWith('.appimage'));
            const screenshot = `linux-${process.env.RELEASE_TAG.includes('arm64') ? 'arm64' : 'x64'}-dashboard.svg`;
            if (keep.length === 0) throw new Error('No new Linux AppImage found; refusing to delete old release assets.');
            if (!fs.existsSync(`screenshots/${screenshot}`)) throw new Error('Expected Linux dashboard preview missing; refusing to clean release assets.');
            keep.push(screenshot);
            const release = await github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag: process.env.RELEASE_TAG});
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner: context.repo.owner, repo: context.repo.repo, release_id: release.data.id, per_page: 100});
            for (const asset of assets) {
              if (!keep.includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id});
                core.info('Deleted stale Linux asset: ' + asset.name);
              }
            }
