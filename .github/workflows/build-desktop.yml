name: Build Orbit Browser Windows and Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'app/**', 'package.json', 'app.json', '.github/workflows/build-desktop.yml']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Expo app dependencies
        run: npm install --legacy-peer-deps
      - name: Generate premium Orbit app icon
        run: |
          npm install --no-save --package-lock=false sharp
          node -e "require('sharp')('assets/orbit-icon.svg').resize(1024,1024).png().toFile('assets/orbit-icon.png').then(()=>console.log('Generated Orbit icon'))"
      - name: Install Expo web dependencies
        run: npx expo install react-dom react-native-web expo-linking expo-constants expo-font
      - name: Export web app
        run: npx expo export --platform web
      - name: Prepare desktop package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/renderer | Out-Null
          Copy-Item dist/* desktop/renderer/ -Recurse -Force
          npm --prefix desktop install --include=dev
      - name: Verify Electron installation
        run: npm --prefix desktop exec -- electron --version
      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Windows-${{ matrix.arch }}-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-windows-${{ matrix.arch }}-latest
          name: Orbit Browser Windows ${{ matrix.arch }} (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: desktop/dist/*.exe
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Expo app dependencies
        run: npm install --legacy-peer-deps
      - name: Export web app
        run: npx expo export --platform web
      - name: Prepare desktop package
        run: mkdir -p desktop/renderer && cp -r dist/* desktop/renderer/ && npm --prefix desktop install --include=dev
      - name: Verify Electron installation
        run: npm --prefix desktop exec -- electron --version
        env:
          ELECTRON_DISABLE_SANDBOX: 1
      - name: Build Linux AppImage
        working-directory: desktop
        run: npx electron-builder --linux AppImage --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Linux-${{ matrix.arch }}-AppImage
          path: desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-browser-linux-${{ matrix.arch }}-latest
          name: Orbit Browser Linux ${{ matrix.arch }} (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: desktop/dist/*.AppImage
      - name: Remove obsolete illustrative screenshot assets
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: orbit-browser-linux-${{ matrix.arch }}-latest
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag: process.env.RELEASE_TAG});
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner: context.repo.owner, repo: context.repo.repo, release_id: release.data.id, per_page: 100});
            const appImages = assets.filter(asset => asset.name.toLowerCase().endsWith('.appimage'));
            if (appImages.length === 0) throw new Error('No AppImage found; refusing to clean release assets.');
            for (const asset of assets) {
              if (!asset.name.toLowerCase().endsWith('.appimage')) {
                await github.rest.repos.deleteReleaseAsset({owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id});
                core.info('Removed non-AppImage release asset: ' + asset.name);
              }
            }
