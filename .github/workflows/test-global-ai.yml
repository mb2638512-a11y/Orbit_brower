name: Test Global AI API
on:
  push:
    paths:
      - "global-ai/**"
      - ".github/workflows/test-global-ai.yml"
  pull_request:
    paths:
      - "global-ai/**"
      - ".github/workflows/test-global-ai.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: global-ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py
      - run: pytest -q
